<!doctype html>
<html lang="en" data-theme="paper">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#4d7cff" />
    %sveltekit.head%
    <script>
      // Resolve the stored theme before first paint to avoid a flash.
      try {
        const stored = localStorage.getItem("smc:preferences");
        const theme = stored ? JSON.parse(stored).theme : "system";
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;
        const known = ["paper", "sepia", "ink", "slate"];
        document.documentElement.dataset.theme = known.includes(theme)
          ? theme
          : prefersDark
            ? "ink"
            : "paper";
      } catch {
        // Storage can be unavailable (private mode); the default stands.
      }
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
